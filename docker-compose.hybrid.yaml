# =============================================================================
# Docker Compose - Hybrid Mode
# =============================================================================
# Client-hosted sandbox that connects to Meridyen cloud for LLM services
#
# Usage:
#   1. Copy config/sandbox.example.yaml to config/sandbox.yaml
#   2. Edit sandbox.yaml with your settings
#   3. docker-compose -f docker-compose.hybrid.yaml up -d

name: meridyen-sandbox-hybrid

services:
  # ---------------------------------------------------------------------------
  # Sandbox PostgreSQL - Dedicated database for uploaded file data
  # ---------------------------------------------------------------------------
  sandbox-postgres:
    image: pgvector/pgvector:pg16
    container_name: meridyen-sandbox-postgres
    restart: unless-stopped

    ports:
      - "${SANDBOX_PG_PORT:-5433}:5432"

    environment:
      - POSTGRES_DB=sandbox_uploads
      - POSTGRES_USER=sandbox
      - POSTGRES_PASSWORD=sandbox_password

    volumes:
      - sandbox_postgres_data:/var/lib/postgresql/data

    networks:
      - sandbox-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox_uploads"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Sandbox Container
  # ---------------------------------------------------------------------------
  sandbox:
    image: meridyen/sandbox:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meridyen-sandbox
    restart: unless-stopped

    # Tag this container so the `autoheal` sidecar will restart it when
    # Docker marks it unhealthy (the healthcheck below catches FreeTDS
    # worker crashes that --reload alone can't recover from).
    labels:
      - "autoheal=true"

    depends_on:
      sandbox-postgres:
        condition: service_healthy

    ports:
      - "${SANDBOX_REST_PORT:-8081}:8080"
      - "${SANDBOX_GRPC_PORT:-50051}:50051"
      - "${SANDBOX_METRICS_PORT:-9091}:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # Execution mode
      - SANDBOX_EXECUTION_MODE=${SANDBOX_EXECUTION_MODE:-hybrid}
      - SANDBOX_ENVIRONMENT=${SANDBOX_ENVIRONMENT:-production}

      # Authentication
      - SANDBOX_AUTHENTICATION__PROVIDER=${SANDBOX_AUTHENTICATION__PROVIDER:-static}
      - SANDBOX_AUTHENTICATION__REMOTE_URL=${SANDBOX_AUTHENTICATION__REMOTE_URL:-}
      - SANDBOX_AUTHENTICATION__REMOTE_TIMEOUT=${SANDBOX_AUTHENTICATION__REMOTE_TIMEOUT:-5.0}
      - SANDBOX_AUTHENTICATION__ENABLE_API_KEY_AUTH=${SANDBOX_AUTHENTICATION__ENABLE_API_KEY_AUTH:-true}

      # User authentication (web UI login)
      - SANDBOX_AUTH_USERNAME=${SANDBOX_AUTH_USERNAME:-admin}
      - SANDBOX_AUTH_PASSWORD=${SANDBOX_AUTH_PASSWORD:-admin123}
      - SANDBOX_AUTH_JWT_SECRET=${SANDBOX_AUTH_JWT_SECRET:-sandbox-jwt-secret-change-me-to-something-secure}

      # Platform connection
      - SANDBOX_PLATFORM__PLATFORM_URL=${PLATFORM_URL:-https://api.meridyen.ai}
      - SANDBOX_PLATFORM__SPACE_ID=${SPACE_ID}
      - SANDBOX_PLATFORM__REGISTRATION_TOKEN=${REGISTRATION_TOKEN}
      - SANDBOX_PLATFORM__MTLS_ENABLED=${SANDBOX_PLATFORM__MTLS_ENABLED:-false}

      # Resource limits
      - SANDBOX_RESOURCE_LIMITS__MAX_MEMORY_MB=${MAX_MEMORY_MB:-512}
      - SANDBOX_RESOURCE_LIMITS__MAX_CPU_SECONDS=${MAX_CPU_SECONDS:-60}
      - SANDBOX_RESOURCE_LIMITS__MAX_ROWS=${MAX_ROWS:-100000}

      # Upload database (sandbox-postgres)
      - SANDBOX_UPLOAD_DB_HOST=sandbox-postgres
      - SANDBOX_UPLOAD_DB_PORT=5432
      - SANDBOX_UPLOAD_DB_NAME=sandbox_uploads
      - SANDBOX_UPLOAD_DB_USER=sandbox
      - SANDBOX_UPLOAD_DB_PASSWORD=sandbox_password

    volumes:
      # Configuration
      - ./config:/app/config:ro
      # Persistent data (connections, etc.)
      - sandbox_data:/app/data
      # Logs (optional)
      - sandbox_logs:/app/logs
      # SSL certificates (if using mTLS)
      - ./certs:/app/certs:ro

    networks:
      - sandbox-network
      - client-database-network

    deploy:
      resources:
        limits:
          cpus: "${SANDBOX_CPU_LIMIT:-2}"
          memory: "${SANDBOX_MEMORY_LIMIT:-2G}"
        reservations:
          cpus: "0.5"
          memory: "512M"

    healthcheck:
      # Fail if the uvicorn worker is dead/defunct or /health doesn't answer fast.
      # /health alone is not enough: the --reload parent keeps the port open
      # and answers even after the worker process abort()s (e.g. FreeTDS crash).
      # The pattern is built at runtime so it doesn't appear in this script's
      # own cmdline and produce a self-match.
      test:
        - CMD-SHELL
        - |
          set -e
          pat="$$(printf 'spawn_%s(tracker_fd' main)"
          live=0
          for d in /proc/[0-9]*; do
            [ -r "$$d/status" ] || continue
            grep -q '^State:.[RSDT]' "$$d/status" 2>/dev/null || continue
            tr '\0' ' ' < "$$d/cmdline" 2>/dev/null \
              | grep -qF "$$pat" && { live=1; break; }
          done
          [ "$$live" = 1 ]
          curl -fsS --max-time 5 http://localhost:8080/health > /dev/null
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Autoheal sidecar - restarts containers that Docker marks unhealthy.
  # Restart policy on its own only restarts on container exit, not on an
  # unhealthy state, so we need this to actually act on the healthcheck above.
  # Only acts on containers labeled `autoheal=true`.
  # ---------------------------------------------------------------------------
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: meridyen-sandbox-autoheal
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
      - CURL_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  sandbox_data:
    driver: local
  sandbox_logs:
    driver: local
  sandbox_postgres_data:
    external: true
    name: meridyen_sandbox_postgres_data

networks:
  sandbox-network:
    driver: bridge
  # Connect to your existing database network
  # Set DATABASE_NETWORK_EXTERNAL=true if you want to use an existing external network
  client-database-network:
    external: ${DATABASE_NETWORK_EXTERNAL:-false}
    name: ${DATABASE_NETWORK:-client-databases}
    driver: bridge
