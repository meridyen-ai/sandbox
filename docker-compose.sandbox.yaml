# =============================================================================
# Docker Compose - Sandbox Standalone (sandbox.meridyen.ai)
# =============================================================================
# Runs sandbox backend + frontend in Docker containers with custom ports.
# Uses unique container names to avoid conflicts with make cloud.
#
# Usage:
#   make sandbox-dev   (development with hot reload)
#   make sandbox       (production with built frontend)
#   make sandbox-stop  (stop all)

name: sandbox-standalone

services:
  # ---------------------------------------------------------------------------
  # Sandbox PostgreSQL - Dedicated database for uploaded file data
  # ---------------------------------------------------------------------------
  sandbox-postgres:
    image: postgres:16-alpine
    container_name: sandbox-standalone-postgres
    restart: unless-stopped

    ports:
      - "${SANDBOX_PG_PORT:-35433}:5432"

    environment:
      - POSTGRES_DB=sandbox_uploads
      - POSTGRES_USER=sandbox
      - POSTGRES_PASSWORD=sandbox_password

    volumes:
      - sandbox_postgres_data:/var/lib/postgresql/data

    networks:
      - sandbox-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox_uploads"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Sandbox Backend (FastAPI + gRPC)
  # ---------------------------------------------------------------------------
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: sandbox-standalone-backend
    restart: unless-stopped

    depends_on:
      sandbox-postgres:
        condition: service_healthy

    # Clear inherited ENTRYPOINT so command runs directly
    entrypoint: []

    # Development: uvicorn with hot reload
    command: >
      sh -c "cd /app/src && uvicorn sandbox.main:app
      --host 0.0.0.0 --port 8080
      --reload --reload-dir /app/src/sandbox
      --log-level debug"

    ports:
      - "${SANDBOX_REST_PORT:-38082}:8080"
      - "${SANDBOX_GRPC_PORT:-50052}:50051"
      - "${SANDBOX_METRICS_PORT:-39091}:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      - SANDBOX_ENVIRONMENT=development
      - SANDBOX_DEBUG=true
      - SANDBOX_CONFIG_PATH=/app/config/sandbox.yaml
      - PYTHONUNBUFFERED=1
      # Limit threads to prevent memory issues
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      # Execution mode
      - SANDBOX_EXECUTION_MODE=${SANDBOX_EXECUTION_MODE:-airgapped}
      # Disable TLS
      - SANDBOX_PLATFORM__MTLS_ENABLED=false
      # Authentication (API key)
      - SANDBOX_AUTHENTICATION__PROVIDER=${SANDBOX_AUTHENTICATION__PROVIDER:-static}
      - SANDBOX_AUTHENTICATION__REMOTE_URL=${SANDBOX_AUTHENTICATION__REMOTE_URL:-}
      - SANDBOX_AUTHENTICATION__REMOTE_TIMEOUT=5.0
      - SANDBOX_AUTHENTICATION__ENABLE_API_KEY_AUTH=true
      # User authentication (web UI login)
      - SANDBOX_AUTH_USERNAME=${SANDBOX_AUTH_USERNAME:-admin}
      - SANDBOX_AUTH_PASSWORD=${SANDBOX_AUTH_PASSWORD:-admin123}
      - SANDBOX_AUTH_JWT_SECRET=${SANDBOX_AUTH_JWT_SECRET:-sandbox-jwt-secret-change-me-to-something-secure}
      # Upload database
      - SANDBOX_UPLOAD_DB_HOST=sandbox-postgres
      - SANDBOX_UPLOAD_DB_PORT=5432
      - SANDBOX_UPLOAD_DB_NAME=sandbox_uploads
      - SANDBOX_UPLOAD_DB_USER=sandbox
      - SANDBOX_UPLOAD_DB_PASSWORD=sandbox_password

    volumes:
      # Mount source code for hot reload
      - ./src:/app/src:rw
      - ./config:/app/config:ro
      # Persistent data
      - sandbox_data:/app/data
      - sandbox_logs:/app/logs

    networks:
      - sandbox-network

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: "4G"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Frontend (Vite dev server with HMR)
  # ---------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: sandbox-standalone-frontend
    restart: unless-stopped
    working_dir: /app

    depends_on:
      sandbox:
        condition: service_healthy

    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 5180"

    ports:
      - "${SANDBOX_FRONTEND_PORT:-5180}:5180"

    environment:
      - NODE_ENV=development
      - VITE_PROXY_TARGET=http://sandbox:8080

    volumes:
      - ./frontend:/app:rw
      - ./sdks/react:/sdks/react:ro
      - sandbox_frontend_node_modules:/app/node_modules

    networks:
      - sandbox-network

    stdin_open: true
    tty: true

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sandbox_data:
    driver: local
  sandbox_logs:
    driver: local
  sandbox_postgres_data:
    driver: local
  sandbox_frontend_node_modules:
    driver: local

networks:
  sandbox-network:
    driver: bridge
